name: Deployment

on:
  push:
    branches:
      - main
  # Lets a deploy be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on remote server via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          # The host only accepts public key authentication; REMOTE_SSH_KEY
          # holds the private half of the key in its authorized_keys.
          key: ${{ secrets.REMOTE_SSH_KEY }}
          port: 2222
          # `make up` rebuilds the images and lets steamcmd check the game
          # install, neither of which fits in the 10m default.
          command_timeout: 30m
          # Without this the job stays green even when the deploy fails.
          script_stop: true
          script: |
            cd ~/nmrih
            git fetch origin main
            git checkout -B main origin/main
            make docker-re-run
            make ps
