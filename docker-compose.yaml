services:
  # The game itself: steamcmd installs/updates NMRiH app 317670 on every start
  # and then runs srcds. Its log directory is the same host directory log_api
  # reads, which is the whole integration between the two halves of this repo.
  nmrih_server:
    container_name: nmrih_server
    image: "nmrih_server:latest"
    build:
      dockerfile: Dockerfile
      context: nmrih_server
    restart: unless-stopped
    # srcds reads console commands from stdin; keeping it open makes
    # `make server-console` (docker attach) work.
    stdin_open: true
    tty: true
    stop_grace_period: 30s
    environment:
      - NMRIH_HOSTNAME=${NMRIH_HOSTNAME:-NMRiH Server}
      - NMRIH_SV_PASSWORD=${NMRIH_SV_PASSWORD:-}
      - NMRIH_RCON_PASSWORD=${NMRIH_RCON_PASSWORD:-}
      - NMRIH_SV_REGION=${NMRIH_SV_REGION:-3}
      - NMRIH_SV_CONTACT=${NMRIH_SV_CONTACT:-}
      - NMRIH_GSLT=${NMRIH_GSLT:-}
      - NMRIH_MAP=${NMRIH_MAP:-nmo_broadway}
      - NMRIH_MAXPLAYERS=${NMRIH_MAXPLAYERS:-8}
      - NMRIH_PORT=${NMRIH_PORT:-27015}
      - NMRIH_CLIENT_PORT=${NMRIH_CLIENT_PORT:-27005}
      - NMRIH_TV_PORT=${NMRIH_TV_PORT:-27020}
      - NMRIH_TV_ENABLE=${NMRIH_TV_ENABLE:-0}
      - NMRIH_EXTRA_ARGS=${NMRIH_EXTRA_ARGS:-}
      - NMRIH_SKIP_UPDATE=${NMRIH_SKIP_UPDATE:-0}
      - NMRIH_VALIDATE=${NMRIH_VALIDATE:-}
      - NMRIH_SOURCEMOD=${NMRIH_SOURCEMOD:-1}
    ports:
      # Source reports the port it was started with to the master servers, so
      # host and container port have to match for a publicly listed server.
      - "${NMRIH_PORT:-27015}:${NMRIH_PORT:-27015}/udp"
      - "${NMRIH_PORT:-27015}:${NMRIH_PORT:-27015}/tcp"
      - "${NMRIH_TV_PORT:-27020}:${NMRIH_TV_PORT:-27020}/udp"
    volumes:
      # ~9 GB of game files - kept on the host so updates are incremental and
      # custom maps/addons survive a rebuild.
      - "${NMRIH_DATA_DIR:-./server_data}:/srv/nmrih"
      - "./logs:/srv/nmrih/nmrih/logs"
      # Compiled plugins from this repository; the entrypoint copies them into
      # the game on start, so shipping a new build of one is just a restart.
      - "./sourcemod/plugins:/opt/nmrih/plugins:ro"
    networks:
      - traefik-net

  traefik:
    depends_on:
      log_api:
        condition: service_healthy
    build:
      dockerfile: Dockerfile
      context: traefik
    image: "nmrih_traefik:latest"
    container_name: nmrih_traefik
    restart: on-failure
    command:
      - "--log.level=WARN"
      - "--api.dashboard=false"
      - "--api.insecure=false"
      - "--entryPoints.http.address=:80"
      - "--entryPoints.https.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--certificatesResolvers.myresolver.acme.httpChallenge.entryPoint=http"
      # Traefik takes its static config from exactly one source and CLI flags
      # win, so traefik/traefik.yaml is never consulted - email and storage
      # have to be passed here or ACME writes its certs to a throwaway path.
      - "--certificatesResolvers.myresolver.acme.email=${TRAEFIK_ACME_EMAIL}"
      - "--certificatesResolvers.myresolver.acme.storage=${TRAEFIK_ACME_STORAGE:-/etc/traefik/acme/acme.json}"
    environment:
      - TRAEFIK_ACME_EMAIL=${TRAEFIK_ACME_EMAIL}
      - TRAEFIK_ACME_STORAGE=${TRAEFIK_ACME_STORAGE}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/acme:/etc/traefik/acme"
    networks:
      - traefik-net

  # Keeps the dashboard's DuckDNS record pointed at this machine's current
  # public IP (home connections do not get a static one). Off by default,
  # because a host that already runs an updater only needs the subdomain added
  # there: `docker compose --profile public up -d duckdns` to run it here.
  duckdns:
    container_name: nmrih_duckdns
    image: lscr.io/linuxserver/duckdns:latest
    profiles: ["public"]
    environment:
      - SUBDOMAINS=${DUCKDNS_SUBDOMAIN:-}
      - TOKEN=${DUCKDNS_TOKEN:-}
    restart: unless-stopped
    networks:
      - traefik-net

  redis:
    container_name: nmrih_redis
    image: redis:8.2.0-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}", "--port", "7379"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "7379:7379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - traefik-net

  log_api:
    container_name: nmrih_log_api
    image: "nmrih_log_api:latest"
    restart: unless-stopped
    build:
      dockerfile: Dockerfile
      context: log_api
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8190/health-check | grep 200 || exit 1"]
      timeout: 3s
      retries: 3
      start_period: 3s
    depends_on:
      redis:
        condition: service_healthy
      # A2S queries go to the game container over the compose network, so its
      # name has to resolve before log_api builds its client.
      nmrih_server:
        condition: service_started
    volumes:
      - shared_data:/data
      - ./logs:/logs
    ports:
      - "8190"
    environment:
      - ENV=prod
      - GIN_MODE=release
      - PORT=8190
      # Defaults to the game container next door; override in .env to point the
      # dashboard at a server running somewhere else.
      - SERVER_ADDR=${SERVER_ADDR:-nmrih_server}
      - SERVER_PORT=${NMRIH_PORT:-27015}
      - CSV_STORAGE_DIRECTORY=/data
      - LOGS_STORAGE_DIRECTORY=/logs/
      # srcds names its files L<MMDD><NNN>.log (capital L), the glob covers
      # both spellings.
      - LOGS_FILE_PATTERN=${LOGS_FILE_PATTERN:-[Ll]*.log}
      - IP_INFO_API_TOKEN=${IP_INFO_API_TOKEN}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_ADDR=redis:7379
      - LOG_GRAPH_HANDLER_CACHE_TTL_MINUTES=5
      - LOG_GRAPH_HANDLER_CACHE_TIMEOUT_SECONDS=10
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.log_api-secure.rule=Host(`api.rulat-bot.duckdns.org`)"
      - "traefik.http.routers.log_api-secure.entryPoints=https"
      - "traefik.http.routers.log_api-secure.tls=true"
      - "traefik.http.routers.log_api-secure.tls.certresolver=myresolver"

  log_frontend:
    container_name: nmrih_log_frontend
    image: nmrih_log_frontend:latest
    restart: unless-stopped
    build:
      dockerfile: Dockerfile
      context: log_frontend
    ports:
      - "8191"
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.log_frontend-secure.tls=true"
      - "traefik.http.routers.log_frontend-secure.rule=Host(`rulat-bot.duckdns.org`)"
      - "traefik.http.routers.log_frontend-secure.entryPoints=https"
      - "traefik.http.routers.log_frontend-secure.tls.certresolver=myresolver"

volumes:
  shared_data:
  redis-data:

networks:
  traefik-net:
    driver: bridge
